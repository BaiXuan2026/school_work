  <body>
   
    <div id="GameDiv" cc_exact_fit_screen="false" style="width: 960px; height: 720px;">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>

    </p>
    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<script>
(function () {
  // Compute absolute base URL from the current page's location.
  // This removes any query string / hash AND the trailing filename (index.html),
  // leaving us with a fully-qualified URL ending in "/".
  var href = window.location.href.split('#')[0].split('?')[0];
  var lastSlash = href.lastIndexOf('/');
  var baseHref = href.substring(0, lastSlash + 1);

  // Build an import-map with ABSOLUTE URLs (computed from baseHref).
  // Using absolute URLs bypasses ALL relative-path resolution edge cases
  // (e.g. URL-encoded Chinese characters in the path, <base> tag interactions).
  var importMap = {
    imports: {
      "cc": baseHref + 'cocos-js/cc.js'
    }
  };

  // Inject a <script type="systemjs-importmap"> node into <head>.
  // SystemJS 6.x scans DOM for these nodes via prepareImport().
  var importMapScript = document.createElement('script');
  importMapScript.type = 'systemjs-importmap';
  importMapScript.textContent = JSON.stringify(importMap);
  document.head.appendChild(importMapScript);

  // Force SystemJS to re-scan the DOM now so the newly injected map is picked up.
  if (typeof System.prepareImport === 'function') {
    System.prepareImport(true);
  }

  // Load the entry module with its absolute URL so the starting point is unambiguous.
  System.import(baseHref + 'index.js').catch(function (err) {
    console.error('SystemJS failed to load index.js from ' + baseHref + 'index.js', err);
  });
})();
</script>
  </body>
</html>
